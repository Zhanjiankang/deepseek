<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts 3D - 散点图示例</title>
    
    <!-- 1. 引入 jQuery (这是您缺少的部分) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl/dist/echarts-gl.min.js"></script>

    <!-- 4. 引入 jsPDF 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background-color: #f5f5f5; }
        .btn-group { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 24px; margin: 0 10px; cursor: pointer; background-color: #3375E3; color: white; border: none; border-radius: 6px; }
        button:hover { background-color: #285ec0; }
        #main { width: 90%; max-width: 1000px; height: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="btn-group">
        <button id="download-png">🖼️ 下载 PNG</button>
        <button id="download-pdf">📄 下载 PDF</button>
    </div>
    <div id="main"></div>
    
    <!-- 引入您的 JS 文件 -->
    <script src="模版.js"></script>
</body>
</html>
