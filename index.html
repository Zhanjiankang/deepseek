<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI助手 - 语音交互版</title>
    
    <!-- Bootstrap 5 CSS框架 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --cyan: #00f3ff;
            --dark: #e6e6f0;
        }
        
        /* 3D 舞台 - 右下角定位（更小尺寸，无边框） */
        model-viewer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 250px;
            background: radial-gradient(circle at center, #f8f9fb 0%, #f0eeee 100%);
            --progress-bar-color: var(--cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            z-index: 1000;
        }
        
        /* 聊天面板 - 置于机器人左侧（白色透明背景，黑色边框） */
        #panel {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 240px;
            width: 350px;
            height: 500px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
            z-index: 1001;
        }
        
        .panel-header {
            padding: 15px;
            border-bottom: 1px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.3);
            color: #000;
        }
        
        .panel-header i {
            color: #000;
        }
        
        #logs {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .msg {
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.4;
            max-width: 85%;
        }
        
        .sys {
            color: #000;
            border-left: 2px solid var(--cyan);
            background: rgba(0, 243, 255, 0.1);
            align-self: flex-start;
        }
        
        .user {
            color: #000;
            background: rgba(200, 200, 200, 0.3);
            align-self: flex-end;
            border: 1px solid #ccc;
        }
        
        .input-zone {
            padding: 15px;
            border-top: 1px solid #000;
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            background: transparent;
            border: 1px solid #000;
            color: #000;
            padding: 8px;
            outline: none;
        }
        
        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* 机器人图标样式 */
        .robot-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(0, 243, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: all 0.3s ease;
        }
        
        .robot-icon:hover {
            background: rgba(0, 243, 255, 1);
            transform: scale(1.1);
        }
        
        .robot-icon i {
            font-size: 24px;
            color: #000;
        }
        
        /* 交互提示 */
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
        }
        
        /* 语音按钮样式 */
        .voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .voice-btn:hover {
            background: rgba(0, 243, 255, 0.3);
        }
        
        .voice-btn.listening {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 状态指示器 */
        .status {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
        }
        
        .status.recording .status-dot {
            background: #f44336;
        }
        
        .status.speaking .status-dot {
            background: #2196F3;
        }
    </style>
</head>
<body>
    <!-- 3D 模型：使用最稳定的 RobotExpressive -->
    <!-- 关键参数：environment-image="neutral" 防止黑屏 -->
    <!-- <model-viewer 
        id="bot" 
        src="/Robot.glb" 
        environment-image="neutral" 
        shadow-intensity="1"
        camera-controls 
        camera-orbit="0deg 75deg 105%"
        field-of-view="30deg"
        autoplay
        animation-name="Idle"
        style="display: none;">
    </model-viewer> -->

    <div class="hint" style="display: none;">/// 点击机器人终端建立连接 ///</div>

    <!-- 交互面板 -->
    <div id="panel" style="display: none;">
        <div class="panel-header">
            <span><i class="fas fa-terminal"></i> DEEPSEEK AI</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="togglePanel()"></i>
        </div>
        <div id="logs"></div>
        <div class="input-zone">
            <input type="text" id="inputMsg" placeholder="输入您的问题或点击麦克风...">
            <button class="voice-btn" id="voiceBtn" title="语音输入"><i class="fas fa-microphone"></i></button>
            <button onclick="sendMsg()">发送</button>
        </div>
        <div class="status" id="statusIndicator">
            <div class="status-dot"></div>
            <span>待命...</span>
        </div>
    </div>

    <!-- 机器人图标 - 初始显示在页脚 -->
    <div id="robot-icon" class="robot-icon" onclick="togglePanel()">
        <i class="fas fa-robot"></i>
    </div>

    <!-- JavaScript -->
    <script>
        // 语音识别和语音合成变量
        let recognition = null;
        let isRecording = false;
        let synthesis = window.speechSynthesis;
        let currentUtterance = null;
        
        // 面板状态
        let isPanelOpen = false;
        
        // 切换面板显示
        function togglePanel() {
            const panel = document.getElementById('panel');
            const hint = document.querySelector('.hint');
            
            isPanelOpen = !isPanelOpen;
            
            if (isPanelOpen) {
                panel.style.display = 'flex';
                hint.style.display = 'none';
                document.getElementById('inputMsg').focus();
            } else {
                panel.style.display = 'none';
                hint.style.display = 'block';
            }
        }
        
        // 初始化语音识别
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                document.getElementById('voiceBtn').disabled = true;
                document.getElementById('voiceBtn').title = "您的浏览器不支持语音识别";
                updateStatus('error', '不支持语音识别');
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('listening');
                updateStatus('recording', '正在聆听...');
            };
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('inputMsg').value = transcript;
                
                // 自动发送
                setTimeout(() => {
                    sendMsg();
                }, 300);
            };
            
            recognition.onerror = function(event) {
                console.error("语音识别错误:", event.error);
                stopRecording();
                
                if (event.error === 'not-allowed') {
                    alert("请允许浏览器使用麦克风权限");
                    updateStatus('error', '需要麦克风权限');
                } else {
                    updateStatus('error', '识别错误');
                }
            };
            
            recognition.onend = function() {
                stopRecording();
            };
        }
        
        // 开始/停止录音
        function toggleVoiceInput() {
            if (!recognition) {
                initSpeechRecognition();
            }
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        function startRecording() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (error) {
                    console.error("开始录音失败:", error);
                    updateStatus('error', '录音失败');
                }
            }
        }
        
        function stopRecording() {
            if (recognition && isRecording) {
                try {
                    recognition.stop();
                } catch (error) {
                    console.error("停止录音失败:", error);
                }
                isRecording = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                updateStatus('idle', '待命...');
            }
        }
        
        // 发送消息
        function sendMsg() {
            const msg = document.getElementById('inputMsg').value.trim();
            const logs = document.getElementById('logs');
            
            if (!msg) return;
            
            // 添加用户消息
            addMessage(msg, 'user');
            document.getElementById('inputMsg').value = '';
            
            // 显示思考中
            updateStatus('thinking', '思考中...');
            addMessage('思考中...', 'sys');
            
            // 模拟AI回复
            setTimeout(() => {
                // 这里应该是调用API获取回复
                const response = "这是模拟回复。实际应该调用DeepSeek API获取真实回复。";
                
                // 移除"思考中..."消息
                logs.removeChild(logs.lastChild);
                
                // 添加AI回复
                addMessage(response, 'sys');
                updateStatus('idle', '待命...');
                
                // 语音播报
                speakResponse(response);
            }, 1500);
        }
        
        // 添加消息到聊天记录
        function addMessage(text, type) {
            const logs = document.getElementById('logs');
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            msg.textContent = text;
            logs.appendChild(msg);
            logs.scrollTop = logs.scrollHeight;
        }
        
        // 语音输出
        function speakResponse(text) {
            stopSpeaking();
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'zh-CN';
            currentUtterance.rate = 1.0;
            currentUtterance.pitch = 1.0;
            currentUtterance.volume = 1.0;
            
            currentUtterance.onstart = function() {
                updateStatus('speaking', '正在说话...');
            };
            
            currentUtterance.onend = function() {
                updateStatus('idle', '待命...');
            };
            
            currentUtterance.onerror = function(event) {
                console.error("语音合成错误:", event);
                updateStatus('error', '播放失败');
            };
            
            synthesis.speak(currentUtterance);
        }
        
        function stopSpeaking() {
            if (synthesis.speaking) {
                synthesis.cancel();
            }
        }
        
        // 更新状态
        function updateStatus(state, text) {
            const status = document.getElementById('statusIndicator');
            const dot = status.querySelector('.status-dot');
            const textSpan = status.querySelector('span');
            
            status.className = 'status';
            textSpan.textContent = text;
            
            if (state === 'recording') {
                status.classList.add('recording');
            } else if (state === 'speaking') {
                status.classList.add('speaking');
            } else if (state === 'thinking') {
                status.classList.add('thinking');
            } else if (state === 'error') {
                status.classList.add('error');
            }
        }
        
        // 初始化
        window.addEventListener('load', function() {
            // 初始化语音识别
            initSpeechRecognition();
            
            // 绑定事件
            document.getElementById('voiceBtn').addEventListener('click', toggleVoiceInput);
            document.getElementById('inputMsg').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMsg();
                }
            });
            
            // 测试消息
            addMessage("您好！我是DeepSeek AI助手，请问有什么可以帮您？", 'sys');
        });
    </script>
</body>
</html>
