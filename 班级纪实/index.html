<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物含妙理 - 班级纪实</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fas fa-atom me-2"></i>物含妙理</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavDropdown">
                    <!-- 导航菜单已移除 -->
                </div>
                <div class="date-display" id="currentDate">----年--月--日 星期-</div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="section-toolbar">
            <button class="btn" type="button" onclick="window.history.back();">
                <i class="fas fa-arrow-left me-2"></i>返回上一层
            </button>
        </div>
        
        <!-- 图片轮播区域 -->
        <div class="carousel-container">
            <div class="carousel-header">
                <h2 class="carousel-title">
                    <i class="fas fa-images"></i> 班级活动图片
                </h2>
                <div id="carouselCount" class="carousel-count d-none">
                    <i class="fas fa-camera"></i> <span id="carouselImageCount">0</span> 张图片
                </div>
            </div>
            
            <div id="carouselContent">
                <!-- 加载状态 -->
                <div id="carouselLoadingIndicator" class="loading-spinner">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载轮播图片...</p>
                </div>
                
                <!-- 轮播图容器 -->
                <div id="carouselContainer" class="d-none">
                    <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel">
                        <!-- 轮播指示器 -->
                        <div class="carousel-indicators" id="carouselIndicators"></div>
                        
                        <!-- 轮播内容 -->
                        <div class="carousel-inner" id="carouselInner"></div>
                        
                        <!-- 轮播控制按钮 -->
                        <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">上一张</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">下一张</span>
                        </button>
                    </div>
                </div>
                
                <!-- 错误消息 -->
                <div id="carouselErrorMessage" class="error-message d-none">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="carouselErrorText">加载轮播图片时出现错误</span>
                </div>
                
                <!-- 空状态 -->
                <div id="carouselEmptyMessage" class="empty-message d-none">
                    <i class="fas fa-images me-2"></i>暂无轮播图片
                </div>
            </div>
        </div>
        
        <!-- 班级纪实区域 -->
        <div class="records-container">
            <div class="records-header">
                <h1 class="records-title">
                    <i class="fas fa-book-open"></i> 班级纪实
                </h1>
                <div id="recordsCount" class="records-count d-none">
                    <i class="fas fa-list"></i> <span id="recordsItemCount">0</span> 条记录
                </div>
            </div>
            
            <div id="recordsContent">
                <!-- 加载状态 -->
                <div id="recordsLoadingIndicator" class="loading-spinner">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载班级纪实...</p>
                </div>
                
                <!-- 班级纪实列表 -->
                <ul id="recordsList" class="records-list d-none"></ul>
                
                <!-- 错误消息 -->
                <div id="recordsErrorMessage" class="error-message d-none">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="recordsErrorText">加载内容时出现错误</span>
                </div>
                
                <!-- 空状态 -->
                <div id="recordsEmptyMessage" class="empty-message d-none">
                    <i class="fas fa-info-circle me-2"></i>暂无班级纪实
                </div>
            </div>
        </div>
    </div>

    <footer id="about">
        <div class="container">
            <p class="mb-0" style="color: var(--text-dark); font-weight: 500;">
                © 2025 物含妙理 | 探索物理世界的奥秘
            </p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入轮播图片配置文件 -->
    <script src="carousel-images.js"></script>
    <!-- 引入班级纪实配置文件 -->
    <script src="class-records.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 更新日期显示
            updateDateDisplay();
            
            // 初始化图片轮播
            initCarousel();
            
            // 初始化班级纪实
            initClassRecords();
        });
        
        // 更新日期显示
        function updateDateDisplay() {
            const now = new Date();
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('currentDate').textContent =
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
        }
        
        // 初始化图片轮播
        function initCarousel() {
            const loadingIndicator = document.getElementById('carouselLoadingIndicator');
            const carouselContainer = document.getElementById('carouselContainer');
            const errorMessage = document.getElementById('carouselErrorMessage');
            const errorText = document.getElementById('carouselErrorText');
            const emptyMessage = document.getElementById('carouselEmptyMessage');
            const carouselCount = document.getElementById('carouselCount');
            const carouselImageCount = document.getElementById('carouselImageCount');
            
            // 检查轮播图片配置是否存在
            if (!window.carouselData || !window.carouselData.images) {
                showCarouselErrorMessage("轮播图片配置文件 carousel-images.js 未找到或格式不正确");
                return;
            }
            
            const images = window.carouselData.images;
            
            // 检查是否有轮播图片
            if (!images || images.length === 0) {
                showCarouselEmptyMessage();
                return;
            }
            
            // 隐藏加载指示器
            loadingIndicator.classList.add('d-none');
            
            // 显示计数
            carouselCount.classList.remove('d-none');
            carouselImageCount.textContent = images.length;
            
            // 显示轮播容器
            carouselContainer.classList.remove('d-none');
            
            // 渲染轮播图
            renderCarousel(images);
        }
        
        // 渲染轮播图 - 图片按原始尺寸显示
        function renderCarousel(images) {
            const carouselIndicators = document.getElementById('carouselIndicators');
            const carouselInner = document.getElementById('carouselInner');
            
            // 清空现有内容
            carouselIndicators.innerHTML = '';
            carouselInner.innerHTML = '';
            
            // 添加轮播项和指示器
            images.forEach((image, index) => {
                // 创建指示器
                const indicator = document.createElement('button');
                indicator.type = 'button';
                indicator.dataset.bsTarget = '#imageCarousel';
                indicator.dataset.bsSlideTo = index.toString();
                indicator.ariaLabel = `第 ${index + 1} 张`;
                
                if (index === 0) {
                    indicator.className = 'active';
                    indicator.ariaCurrent = 'true';
                }
                
                carouselIndicators.appendChild(indicator);
                
                // 创建轮播项
                const carouselItem = document.createElement('div');
                carouselItem.className = index === 0 ? 'carousel-item active' : 'carousel-item';
                
                // 设置图片
                const img = document.createElement('img');
                img.src = image.src;
                img.alt = image.title || '轮播图片';
                img.className = 'd-block w-100';
                
                // 添加图片加载错误处理
                img.onerror = function() {
                    this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400"><rect width="600" height="400" fill="%23e3f2fd"/><text x="300" y="200" text-anchor="middle" fill="%231e88e5" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">图片加载失败</text></svg>';
                };
                
                // 图片加载成功时获取原始尺寸
                img.onload = function() {
                    // 创建图片尺寸标签
                    const sizeBadge = document.createElement('div');
                    sizeBadge.className = 'image-size-badge';
                    sizeBadge.textContent = `${this.naturalWidth} × ${this.naturalHeight}`;
                    
                    // 添加到轮播项中
                    if (!carouselItem.querySelector('.image-size-badge')) {
                        carouselItem.appendChild(sizeBadge);
                    }
                };
                
                // 创建说明文字
                const caption = document.createElement('div');
                caption.className = 'carousel-caption';
                
                const title = document.createElement('h5');
                title.textContent = image.title || '班级活动图片';
                
                const titleIcon = document.createElement('i');
                titleIcon.className = 'fas fa-image';
                title.prepend(titleIcon);
                
                const description = document.createElement('p');
                description.textContent = image.description || '物含妙理班级精彩瞬间';
                
                // 创建尺寸信息
                const sizeInfo = document.createElement('p');
                sizeInfo.className = 'image-size';
                sizeInfo.textContent = '原始尺寸加载中...';
                
                // 更新尺寸信息
                img.addEventListener('load', function() {
                    sizeInfo.textContent = `原始尺寸: ${this.naturalWidth} × ${this.naturalHeight} 像素`;
                    
                    // 计算比例
                    const ratio = this.naturalWidth / this.naturalHeight;
                    let ratioText = '';
                    if (Math.abs(ratio - 3/4) < 0.05) {
                        ratioText = ' (3:4比例)';
                    } else if (Math.abs(ratio - 4/3) < 0.05) {
                        ratioText = ' (4:3比例)';
                    } else if (Math.abs(ratio - 16/9) < 0.05) {
                        ratioText = ' (16:9比例)';
                    } else if (Math.abs(ratio - 1) < 0.05) {
                        ratioText = ' (1:1正方形)';
                    } else {
                        ratioText = ` (${Math.round(ratio * 100)/100}:1)`;
                    }
                    
                    sizeInfo.textContent += ratioText;
                });
                
                // 组装说明文字
                caption.appendChild(title);
                caption.appendChild(description);
                caption.appendChild(sizeInfo);
                
                // 组装轮播项
                carouselItem.appendChild(img);
                carouselItem.appendChild(caption);
                carouselInner.appendChild(carouselItem);
            });
            
            // 初始化轮播
            const carousel = new bootstrap.Carousel(document.getElementById('imageCarousel'), {
                interval: 4000, // 4秒切换一次
                wrap: true, // 循环播放
                ride: 'carousel', // 自动开始
                pause: 'hover' // 鼠标悬停时暂停
            });
            
            // 添加轮播切换事件，更新尺寸显示
            document.getElementById('imageCarousel').addEventListener('slide.bs.carousel', function(event) {
                const activeIndex = event.to;
                const activeImage = document.querySelectorAll('.carousel-item img')[activeIndex];
                
                if (activeImage && activeImage.complete && activeImage.naturalWidth > 0) {
                    const sizeBadge = document.querySelectorAll('.image-size-badge')[activeIndex];
                    if (sizeBadge) {
                        sizeBadge.textContent = `${activeImage.naturalWidth} × ${activeImage.naturalHeight}`;
                    }
                }
            });
        }
        
        // 初始化班级纪实
        function initClassRecords() {
            const loadingIndicator = document.getElementById('recordsLoadingIndicator');
            const recordsList = document.getElementById('recordsList');
            const errorMessage = document.getElementById('recordsErrorMessage');
            const errorText = document.getElementById('recordsErrorText');
            const emptyMessage = document.getElementById('recordsEmptyMessage');
            const recordsCount = document.getElementById('recordsCount');
            const recordsItemCount = document.getElementById('recordsItemCount');
            
            // 检查班级纪实配置是否存在
            if (!window.classRecordsData || !window.classRecordsData.records) {
                showRecordsErrorMessage("班级纪实配置文件 class-records.js 未找到或格式不正确");
                return;
            }
            
            const records = window.classRecordsData.records;
            
            // 检查是否有班级纪实
            if (!records || records.length === 0) {
                showRecordsEmptyMessage();
                return;
            }
            
            // 隐藏加载指示器
            loadingIndicator.classList.add('d-none');
            
            // 显示计数
            recordsCount.classList.remove('d-none');
            recordsItemCount.textContent = records.length;
            
            // 显示列表
            recordsList.classList.remove('d-none');
            
            // 渲染班级纪实列表
            renderRecordsList(records);
        }
        
        // 渲染班级纪实列表
        function renderRecordsList(records) {
            const recordsList = document.getElementById('recordsList');
            
            // 清空现有内容
            recordsList.innerHTML = '';
            
            // 按日期排序（最新的在前面）
            const sortedRecords = records.sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });
            
            // 添加班级纪实项
            sortedRecords.forEach((record, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'record-item';
                
                // 获取图标
                const iconClass = getRecordIcon(record.type);
                
                // 添加淡入动画
                listItem.style.opacity = '0';
                listItem.style.transform = 'translateY(10px)';
                listItem.style.animation = `fadeInUp 0.5s ease ${index * 0.1}s forwards`;
                
                listItem.innerHTML = `
                    <div class="record-item-icon">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="record-item-content">
                        <a href="${record.link}" class="record-item-title" target="_blank">
                            ${record.title}
                            ${record.type ? `<span class="record-type-badge">${record.type}</span>` : ''}
                        </a>
                        <div class="record-item-date">
                            <i class="fas fa-calendar-alt me-1"></i>${record.date}
                        </div>
                    </div>
                `;
                
                recordsList.appendChild(listItem);
            });
        }
        
        // 根据类型获取图标
        function getRecordIcon(type) {
            const iconMap = {
                'activity': 'fas fa-users',
                'meeting': 'fas fa-chalkboard-teacher',
                'event': 'fas fa-calendar-check',
                'achievement': 'fas fa-trophy',
                'notice': 'fas fa-bullhorn',
                'homework': 'fas fa-book',
                'exam': 'fas fa-file-alt',
                'photo': 'fas fa-camera',
                'video': 'fas fa-video',
                'link': 'fas fa-link'
            };
            
            return iconMap[type] || 'fas fa-file-alt';
        }
        
        // 显示轮播错误消息
        function showCarouselErrorMessage(message) {
            const loadingIndicator = document.getElementById('carouselLoadingIndicator');
            const errorMessage = document.getElementById('carouselErrorMessage');
            const errorText = document.getElementById('carouselErrorText');
            
            loadingIndicator.classList.add('d-none');
            errorText.textContent = message;
            errorMessage.classList.remove('d-none');
        }
        
        // 显示轮播空消息
        function showCarouselEmptyMessage() {
            const loadingIndicator = document.getElementById('carouselLoadingIndicator');
            const emptyMessage = document.getElementById('carouselEmptyMessage');
            
            loadingIndicator.classList.add('d-none');
            emptyMessage.classList.remove('d-none');
        }
        
        // 显示班级纪实错误消息
        function showRecordsErrorMessage(message) {
            const loadingIndicator = document.getElementById('recordsLoadingIndicator');
            const errorMessage = document.getElementById('recordsErrorMessage');
            const errorText = document.getElementById('recordsErrorText');
            
            loadingIndicator.classList.add('d-none');
            errorText.textContent = message;
            errorMessage.classList.remove('d-none');
        }
        
        // 显示班级纪实空消息
        function showRecordsEmptyMessage() {
            const loadingIndicator = document.getElementById('recordsLoadingIndicator');
            const emptyMessage = document.getElementById('recordsEmptyMessage');
            
            loadingIndicator.classList.add('d-none');
            emptyMessage.classList.remove('d-none');
        }
    </script>
</body>
</html>
