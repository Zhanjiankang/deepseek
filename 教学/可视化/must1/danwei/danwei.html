<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力学单位制 - 物理学习游戏</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入KaTeX库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>力学单位制匹配游戏</h1>
        </div>
        <div class="subject-selector">
            <button class="subject-btn" data-subject="physics">
                ⚛️ 力学
            </button>
            <button class="subject-btn" data-subject="electromagnetism">
                ⚡ 电磁学
            </button>
            <button class="subject-btn" data-subject="thermodynamics">
                🔥 热学
            </button>
            <button class="subject-btn" data-subject="optics">
                🌈 光学
            </button>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;">
            <div class="difficulty-selector" style="margin: 0;">
                <button class="difficulty-btn active" data-difficulty="easy">
                    🟢 简单模式
                </button>
                <button class="difficulty-btn" data-difficulty="hard">
                    🔴 困难模式
                </button>
            </div>
            
            <button class="difficulty-btn" id="soundToggleBtn" title="点击切换背景音乐" style="margin: 0;">
                🔇 背景音乐关闭
            </button>
        </div>

        <div class="game-info">
            <div class="info-item">
                <span class="info-label">⏱️ 剩余时间：</span>
                <span class="info-value timer" id="timer">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">📊 完成进度：</span>
                <span class="info-value" id="progress">0/0</span>
            </div>
            <div class="info-item">
                <span class="info-label">🎯 游戏状态：</span>
                <span class="info-value" id="status">准备开始</span>
            </div>
        </div>

        <div class="game-board">
            <div class="column">
                <h3>🎓 物理概念</h3>
                <div id="concepts"></div>
            </div>
            <div class="column">
                <h3>📝 单位</h3>
                <div id="formulas"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startResetBtn">🎮 开始游戏</button>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle">🎉 游戏结束</h2>
            <p id="resultMessage"></p>
            <div class="score" id="finalScore"></div>
            <div id="videoContainer" style="display: none; margin: 20px 0; text-align: center;">
                <video id="resultVideo" width="400" controls autoplay>
                    <source id="videoSource" src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
            <div id="continueButtonContainer" style="text-align: center; margin-top: 15px;">
                <button class="btn btn-primary" onclick="closeModal()">继续游戏</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="mechanics.js"></script>
    <script src="electromagnetism.js"></script>
    <script src="thermodynamics.js"></script>
    <script src="optics.js"></script>
    <audio id="backgroundMusic" loop>
        <source src="background.mp3" type="audio/mpeg">
    </audio>
    <script src="game.js"></script>
</body>
</html>
