<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物含妙理 - PDF查看</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e88e5;
            --primary-light: #64b5f6;
            --primary-dark: #1565c0;
            --primary-gradient: linear-gradient(135deg, #1e88e5 0%, #64b5f6 100%);
            --secondary-color: #37474f;
            --accent-color: #ff6b6b;
            --success-color: #2ecc71;
            --light-blue: #e3f2fd;
            --lighter-blue: #f5faff;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --text-dark: #263238;
            --text-gray: #607d8b;
            --shadow-light: 0 8px 25px rgba(30, 136, 229, 0.08);
            --shadow-medium: 0 12px 30px rgba(30, 136, 229, 0.12);
        }
        
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #f5faff 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }
        
        /* 背景装饰元素 */
        body::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30, 136, 229, 0.05) 0%, rgba(30, 136, 229, 0) 70%);
            z-index: -1;
        }
        
        body::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(100, 181, 246, 0.05) 0%, rgba(100, 181, 246, 0) 70%);
            z-index: -1;
        }
        
        .header {
            background: var(--white);
            color: var(--text-dark);
            padding: 0;
            box-shadow: var(--shadow-light);
            margin-bottom: 25px;
            border-radius: 16px;
            position: relative;
            z-index: 1050;
            overflow: visible;
            border: none;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-gradient);
        }

        .navbar {
            padding: 1.2rem 2rem;
            background: var(--white) !important;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--primary-color) !important;
            transition: all 0.3s ease;
            letter-spacing: -0.5px;
        }

        .navbar-brand:hover {
            color: var(--primary-dark) !important;
            transform: translateY(-2px);
        }
        
        .navbar-brand i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .date-display {
            font-size: 1rem;
            color: var(--white);
            margin-bottom: 0;
            white-space: nowrap;
            font-weight: 500;
            background: var(--primary-gradient);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
        }
        
        .section-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }
        
        .section-toolbar .btn {
            background: rgba(30, 136, 229, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(30, 136, 229, 0.3);
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .section-toolbar .btn:hover {
            background: rgba(30, 136, 229, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.15);
            color: var(--primary-color);
        }
        
        .pdf-container {
            background: var(--white);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--shadow-light);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border: none;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .pdf-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--primary-gradient);
            opacity: 0.8;
        }
        
        .pdf-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(30, 136, 229, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pdf-title i {
            margin-right: 15px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .pdf-viewer {
            width: 100%;
            height: 75vh;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
        }
        
        .pdf-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .pdf-info {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(30, 136, 229, 0.05);
            border-radius: 10px;
            color: var(--text-gray);
            font-weight: 500;
        }
        
        .pdf-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .pdf-actions .btn {
            background: rgba(30, 136, 229, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(30, 136, 229, 0.3);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .pdf-actions .btn:hover {
            background: rgba(30, 136, 229, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.15);
        }
        
        .pdf-actions .btn.download-btn {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success-color);
            border-color: rgba(46, 204, 113, 0.3);
        }
        
        .pdf-actions .btn.download-btn:hover {
            background: rgba(46, 204, 113, 0.2);
        }
        
        .pdf-actions .btn.print-btn {
            background: rgba(255, 107, 107, 0.1);
            color: var(--accent-color);
            border-color: rgba(255, 107, 107, 0.3);
        }
        
        .pdf-actions .btn.print-btn:hover {
            background: rgba(255, 107, 107, 0.2);
        }
        
        footer {
            padding: 1.5rem 0;
            background: var(--white);
            color: var(--text-dark);
            text-align: center;
            border-radius: 16px;
            box-shadow: var(--shadow-light);
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        /* 动画效果 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .navbar-toggler {
            border-color: rgba(30, 136, 229, 0.2);
            border-radius: 8px;
        }
        
        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1);
        }
        
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2830, 136, 229, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
        
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.4rem;
            }
            
            .section-toolbar {
                justify-content: stretch;
            }
            
            .section-toolbar .btn {
                width: 100%;
                justify-content: center;
            }
            
            .pdf-container {
                padding: 20px;
            }
            
            .pdf-title {
                font-size: 1.4rem;
                flex-direction: column;
                gap: 10px;
            }
            
            .pdf-title i {
                margin-right: 0;
            }
            
            .pdf-viewer {
                height: 65vh;
            }
            
            .pdf-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .pdf-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 576px) {
            .pdf-viewer {
                height: 55vh;
            }
            
            .pdf-info {
                font-size: 0.9rem;
                padding: 10px;
            }
        }
        
        /* PDF加载状态 */
        .pdf-loading {
            text-align: center;
            padding: 40px;
        }
        
        .pdf-loading .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        .pdf-loading p {
            color: var(--text-gray);
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fas fa-atom me-2"></i>物含妙理</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavDropdown">
                    <!-- 导航菜单已移除 -->
                </div>
                <div class="date-display" id="currentDate">----年--月--日 星期-</div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="section-toolbar">
            <button class="btn" type="button" onclick="window.history.back();">
                <i class="fas fa-arrow-left me-2"></i>返回上一层
            </button>
        </div>
        
        <div class="pdf-container">
            <h1 class="pdf-title">
                <i class="fas fa-file-pdf"></i>当前目录PDF文件
            </h1>
            
            <div class="pdf-viewer">
                <!-- PDF加载状态 -->
                <div id="pdfLoading" class="pdf-loading">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载PDF文件...</p>
                </div>
                
                <!-- PDF文件将在这里显示 -->
                <!-- 根据实际PDF文件名修改下面的src -->
                <iframe id="pdfFrame" src="./1.pdf" style="width:100%;height:100%;border:none;display:none;"></iframe>
            </div>
            
            <div class="pdf-info">
                <p class="mb-0"><i class="fas fa-file-pdf me-2"></i>当前显示: your-pdf-file.pdf</p>
            </div>
            
            <div class="pdf-actions">
                <button class="btn" onclick="window.open('./1.pdf', '_blank')">
                    <i class="fas fa-external-link-alt me-2"></i>在新窗口打开
                </button>
                <button class="btn download-btn" onclick="downloadPDF()">
                    <i class="fas fa-download me-2"></i>下载PDF
                </button>
                <button class="btn print-btn" onclick="printPDF()">
                    <i class="fas fa-print me-2"></i>打印PDF
                </button>
            </div>
        </div>
    </div>

    <footer id="about">
        <div class="container">
            <p class="mb-0" style="color: var(--text-dark); font-weight: 500;">
                © 2025 物含妙理 | 探索物理世界的奥秘
            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 更新日期显示
            updateDateDisplay();
            
            // 初始化PDF查看器
            initPDFViewer();
        });
        
        // 更新日期显示
        function updateDateDisplay() {
            const now = new Date();
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('currentDate').textContent =
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
        }
        
        // 初始化PDF查看器
        function initPDFViewer() {
            const pdfFrame = document.getElementById('pdfFrame');
            const pdfLoading = document.getElementById('pdfLoading');
            
            // 监听PDF加载完成
            pdfFrame.onload = function() {
                // 隐藏加载状态
                pdfLoading.style.display = 'none';
                // 显示PDF
                pdfFrame.style.display = 'block';
            };
            
            // 设置加载超时处理
            setTimeout(function() {
                if (pdfFrame.style.display === 'none') {
                    pdfLoading.innerHTML = `
                        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                        <p class="mt-3">PDF加载时间过长，请检查文件路径</p>
                        <button class="btn mt-2" onclick="reloadPDF()" style="background: rgba(30, 136, 229, 0.1); color: var(--primary-color); border: 1px solid rgba(30, 136, 229, 0.3);">
                            <i class="fas fa-redo me-2"></i>重新加载
                        </button>
                    `;
                }
            }, 10000); // 10秒后检查
        }
        
        // 下载PDF
        function downloadPDF() {
            const link = document.createElement('a');
            link.href = './1.pdf';
            link.download = '物含妙理-资料.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 显示下载提示
            showMessage('PDF下载已开始', 'success');
        }
        
        // 打印PDF
        function printPDF() {
            const pdfFrame = document.getElementById('pdfFrame');
            try {
                pdfFrame.contentWindow.print();
            } catch (e) {
                showMessage('打印功能需要在新窗口中打开PDF', 'info');
                window.open('./1.pdf', '_blank').print();
            }
        }
        
        // 重新加载PDF
        function reloadPDF() {
            const pdfFrame = document.getElementById('pdfFrame');
            const pdfLoading = document.getElementById('pdfLoading');
            
            // 显示加载状态
            pdfLoading.style.display = 'block';
            pdfLoading.innerHTML = `
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3">正在重新加载PDF文件...</p>
            `;
            
            // 隐藏PDF
            pdfFrame.style.display = 'none';
            
            // 重新加载iframe（添加时间戳防止缓存）
            pdfFrame.src = pdfFrame.src.split('?')[0] + '?t=' + new Date().getTime();
            
            // 重新设置加载监听
            pdfFrame.onload = function() {
                pdfLoading.style.display = 'none';
                pdfFrame.style.display = 'block';
                showMessage('PDF重新加载成功', 'success');
            };
        }
        
        // 显示消息提示
        function showMessage(message, type) {
            // 创建消息元素
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert alert-${type === 'success' ? 'success' : 'info'} alert-dismissible fade show position-fixed`;
            messageDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; box-shadow: var(--shadow-medium); border: none;';
            
            // 设置图标和颜色
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-info-circle';
            const bgColor = type === 'success' ? 'rgba(46, 204, 113, 0.9)' : 'rgba(30, 136, 229, 0.9)';
            messageDiv.style.background = bgColor;
            messageDiv.style.color = 'white';
            
            messageDiv.innerHTML = `
                <i class="fas ${icon} me-2"></i>${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="filter: invert(1);"></button>
            `;
            
            document.body.appendChild(messageDiv);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.remove();
                }
            }, 3000);
        }
        
        // 键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // Ctrl+P 或 Cmd+P 打印
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                printPDF();
            }
            
            // Ctrl+S 或 Cmd+S 下载
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                downloadPDF();
            }
            
            // ESC 键返回
            if (e.key === 'Escape') {
                window.history.back();
            }
        });
    </script>
</body>
</html>
