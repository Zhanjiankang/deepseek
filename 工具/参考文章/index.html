<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物含妙理 - 高中笔记</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fas fa-atom me-2"></i>物含妙理</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavDropdown">
                    <!-- 导航菜单已移除 -->
                </div>
                <div class="date-display" id="currentDate">----年--月--日 星期-</div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="section-toolbar">
            <button class="btn" type="button" onclick="window.history.back();">
                <i class="fas fa-arrow-left me-2"></i>返回上一层
            </button>
        </div>
        
        <div class="reference-container">
            <div class="reference-header">
                <h1 class="reference-title">
                    <i class="fas fa-book"></i> 高中笔记
                </h1>
                <div id="referenceCount" class="reference-count d-none">
                    <i class="fas fa-list"></i> <span id="itemCount">0</span> 个资料
                </div>
            </div>
            
            <div id="referenceContent">
                <!-- 加载状态 -->
                <div id="loadingIndicator" class="loading-spinner">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载高中笔记...</p>
                </div>
                
                <!-- 参考资料列表 -->
                <ul id="referenceList" class="reference-list d-none"></ul>
                
                <!-- 错误消息 -->
                <div id="errorMessage" class="error-message d-none">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="errorText">加载内容时出现错误</span>
                </div>
                
                <!-- 空状态 -->
                <div id="emptyMessage" class="empty-message d-none">
                    <i class="fas fa-info-circle me-2"></i>暂无高中笔记资料
                </div>
            </div>
        </div>
    </div>

    <footer id="about">
        <div class="container">
            <p class="mb-0" style="color: var(--text-dark); font-weight: 500;">
                © 2025 物含妙理 | 探索物理世界的奥秘
            </p>
        </div>
    </footer>

    <!-- 引入高中笔记配置文件 -->
    <script src="reference.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 更新日期显示
            updateDateDisplay();
            
            // 初始化参考资料
            initReferences();
        });
        
        // 更新日期显示
        function updateDateDisplay() {
            const now = new Date();
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('currentDate').textContent =
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
        }
        
        // 初始化参考资料
        function initReferences() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const referenceList = document.getElementById('referenceList');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const emptyMessage = document.getElementById('emptyMessage');
            const referenceCount = document.getElementById('referenceCount');
            const itemCount = document.getElementById('itemCount');
            
            // 检查参考资料配置是否存在
            if (!window.referencesData || !window.referencesData.references) {
                showErrorMessage("高中笔记配置文件 reference.js 未找到或格式不正确");
                return;
            }
            
            const references = window.referencesData.references;
            
            // 检查是否有参考资料
            if (!references || references.length === 0) {
                showEmptyMessage();
                return;
            }
            
            // 隐藏加载指示器
            loadingIndicator.classList.add('d-none');
            
            // 显示计数
            referenceCount.classList.remove('d-none');
            itemCount.textContent = references.length;
            
            // 显示列表
            referenceList.classList.remove('d-none');
            
            // 渲染参考资料列表
            renderReferenceList(references);
        }
        
        // 渲染参考资料列表
        function renderReferenceList(references) {
            const referenceList = document.getElementById('referenceList');
            
            // 清空现有内容
            referenceList.innerHTML = '';
            
            // 按日期排序（最新的在前面）
            const sortedReferences = references.sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });
            
            // 添加参考资料项
            sortedReferences.forEach((reference, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'reference-item';
                
                // 获取图标
                const iconClass = getReferenceIcon(reference.type);
                
                // 添加淡入动画
                listItem.style.opacity = '0';
                listItem.style.transform = 'translateY(10px)';
                listItem.style.animation = `fadeInUp 0.5s ease ${index * 0.1}s forwards`;
                
                listItem.innerHTML = `
                    <div class="reference-item-icon">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="reference-item-content">
                        <a href="${reference.link}" class="reference-item-title" target="_blank">
                            ${reference.title}
                            ${reference.type ? `<span class="reference-type-badge">${reference.type}</span>` : ''}
                        </a>
                        <div class="reference-item-date">
                            <i class="fas fa-calendar-alt me-1"></i>${reference.date}
                        </div>
                    </div>
                `;
                
                referenceList.appendChild(listItem);
            });
        }
        
        // 根据类型获取图标
        function getReferenceIcon(type) {
            const iconMap = {
                'article': 'fas fa-file-alt',
                'video': 'fas fa-video',
                'book': 'fas fa-book',
                'website': 'fas fa-globe',
                'pdf': 'fas fa-file-pdf',
                'presentation': 'fas fa-chalkboard-teacher',
                'exercise': 'fas fa-dumbbell',
                'exam': 'fas fa-file-contract',
                'summary': 'fas fa-clipboard-list',
                'formula': 'fas fa-square-root-alt'
            };
            
            return iconMap[type] || 'fas fa-file-alt';
        }
        
        // 显示错误消息
        function showErrorMessage(message) {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            loadingIndicator.classList.add('d-none');
            errorText.textContent = message;
            errorMessage.classList.remove('d-none');
        }
        
        // 显示空消息
        function showEmptyMessage() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const emptyMessage = document.getElementById('emptyMessage');
            
            loadingIndicator.classList.add('d-none');
            emptyMessage.classList.remove('d-none');
        }
    </script>
</body>
</html>
