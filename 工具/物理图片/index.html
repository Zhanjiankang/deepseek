<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物含妙理 - 图片展示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-images"></i>物理图片展示
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavDropdown">
                    <ul class="navbar-nav"></ul>
                </div>
                <div class="date-display" id="currentDate">----年--月--日 星期-</div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="section-toolbar">
            <button class="btn" type="button" onclick="window.history.back();">
                <i class="fas fa-arrow-left me-2"></i>返回上一层
            </button>
        </div>
        
        <!-- 统计信息 -->
        <div id="statsContainer" class="stats-container">
            <div class="stats-card">
                <i class="fas fa-images"></i>
                <span class="stats-count" id="imageCount">0</span>
                <span class="stats-text">张物理图片</span>
            </div>
        </div>
        
        <div class="grid-container" id="imageGrid">
            <!-- 加载状态 -->
            <div class="loading-spinner">
                <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3">正在加载物理图片...</p>
            </div>
        </div>
    </div>

    <footer id="about">
        <div class="container">
            <p class="mb-0" style="color: var(--text-dark); font-weight: 500;">
                © 2025 物含妙理 | 探索物理世界的奥秘
            </p>
        </div>
    </footer>

    <!-- 引入图片配置文件 -->
    <script src="images.js"></script>
    
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 更新日期显示
            updateDateDisplay();
            
            // 初始化图片展示
            initImageGrid();
        });
        
        // 更新日期显示
        function updateDateDisplay() {
            const now = new Date();
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('currentDate').textContent =
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
        }
        
        // 初始化图片网格
        function initImageGrid() {
            const gridContainer = document.getElementById('imageGrid');
            const statsContainer = document.getElementById('statsContainer');
            
            // 检查图片配置是否存在
            if (!window.imagesData || !window.imagesData.images) {
                showErrorMessage(gridContainer, "图片配置文件 images.js 未找到或格式不正确");
                return;
            }
            
            const images = window.imagesData.images;
            
            // 检查是否有图片
            if (!images || images.length === 0) {
                showErrorMessage(gridContainer, "未找到任何物理图片配置");
                return;
            }
            
            // 清空加载动画
            gridContainer.innerHTML = '';
            
            // 显示统计信息
            statsContainer.style.display = 'flex';
            document.getElementById('imageCount').textContent = images.length;
            
            // 创建图片网格
            images.forEach((image, index) => {
                createImageItem(image, index, gridContainer);
            });
        }
        
        // 创建图片网格项
        function createImageItem(image, index, container) {
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            
            // 添加淡入动画
            gridItem.style.opacity = '0';
            gridItem.style.transform = 'translateY(30px)';
            gridItem.style.animation = `fadeInUp 0.6s ease ${index * 0.1}s forwards`;
            
            gridItem.innerHTML = `
                <div class="grid-header">
                    <h3 class="grid-title">
                        <i class="fas fa-image"></i> ${image.title || '物理图片'}
                        ${image.category ? `<span class="image-category">${image.category}</span>` : ''}
                    </h3>
                </div>
                <div class="image-container">
                    <div class="image-box">
                        <img src="${image.src}" alt="${image.title || '物理图片'}" 
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"600\" height=\"400\" viewBox=\"0 0 600 400\"><rect width=\"600\" height=\"400\" fill=\"%23e3f2fd\"/><text x=\"300\" y=\"200\" text-anchor=\"middle\" fill=\"%231e88e5\" font-family=\"Microsoft YaHei, sans-serif\" font-size=\"20\" font-weight=\"bold\">图片加载失败</text></svg>'">
                    </div>
                    <div class="image-description">
                        ${image.description || '物理现象的精彩展示'}
                    </div>
                    <div class="image-info">
                        <span class="image-number">
                            <i class="fas fa-hashtag"></i> ${index + 1}
                        </span>
                        <span class="image-date">
                            <i class="fas fa-calendar-alt"></i> ${image.date || '未知日期'}
                        </span>
                    </div>
                </div>
            `;
            
            container.appendChild(gridItem);
        }
        
        // 显示错误消息
        function showErrorMessage(container, message) {
            container.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
